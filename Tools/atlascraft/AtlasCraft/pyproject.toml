[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlascraft-pipeline"
version = "2.0.0"
description = "Curated atlas sections to aligned, audited, interactive 3D atlases"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "Pillow>=10,<13", "scikit-image>=0.23,<1", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "nibabel>=5,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
atlascraft = "atlascraft.cli:main"

[tool.setuptools.packages.find]
include = ["atlascraft*"]

[tool.setuptools.package-data]
atlascraft = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
